# Kimlik doğrulama şimdilik kapalı, sadece yerel geliştirme için.
# Hesap silme MongoDB transaction kullandığı için tek düğümlü replica set (rs0) gerekir.
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kontrata
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  mongo_data:
