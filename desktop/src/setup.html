<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Kontrata kurulumu</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e6e6e6;
        --subtle: #f4f4f4;
        --red: #c0362c;
        --radius-card: 12px;
        --radius-control: 8px;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }
      main {
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      h1 {
        font-size: 15px;
        font-weight: 500;
        margin: 0 0 0.35rem;
      }
      p {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 1rem;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 0.75rem 0 0.25rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 0.5px solid var(--line);
        border-radius: var(--radius-control);
        padding: 0.45rem 0.65rem;
        font-size: 14px;
      }
      input:focus {
        outline: 1px solid #2b6cb0;
      }
      .btn {
        margin-top: 1rem;
        display: inline-flex;
        border: 0.5px solid var(--fg);
        border-radius: var(--radius-control);
        background: var(--bg);
        padding: 0.4rem 0.75rem;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .err {
        color: var(--red);
        font-size: 13px;
        min-height: 1.2em;
        margin-top: 0.75rem;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kontrata kurulumu</h1>
      <p>
        Sözleşme verisi bu bilgisayarda kalır. MongoDB sizin ortamınızda çalışmalıdır
        (yerelde <code>docker compose up -d</code>, replica set <code>rs0</code>).
      </p>
      <form id="form">
        <label for="mongo">MONGO_URI</label>
        <input
          id="mongo"
          name="mongo"
          type="text"
          required
          autocomplete="off"
          placeholder="mongodb://localhost:27017"
        />
        <label for="llmUrl">LLM_ENDPOINT_URL</label>
        <input id="llmUrl" name="llmUrl" type="url" autocomplete="off" placeholder="https://…" />
        <label for="llmToken">LLM_TOKEN</label>
        <input id="llmToken" name="llmToken" type="password" autocomplete="off" />
        <button class="btn" type="submit" id="kaydet">Kaydet ve dene</button>
        <p class="err" id="hata" role="alert"></p>
      </form>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
