      EPOSTA:
        value: github.com/oz-fatma/kontrata/backend/graph/model.BildirimYontemiEposta
      SISTEM:
        value: github.com/oz-fatma/kontrata/backend/graph/model.BildirimYontemiSistem
      BELIRTILMEMIS:
        value: github.com/oz-fatma/kontrata/backend/graph/model.BildirimYontemiBelirtilmemis
  SozlesmeDurumu:
