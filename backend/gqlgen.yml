      - github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumu
    enum_values:
      YUKLENDI:
        value: github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumuYuklendi
      ISLENIYOR:
        value: github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumuIsleniyor
      INCELENMEYI_BEKLIYOR:
        value: github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumuIncelenmeyiBekliyor
      ONAYLANDI:
        value: github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumuOnaylandi
      HATA:
        value: github.com/oz-fatma/kontrata/backend/graph/model.SozlesmeDurumuHata
