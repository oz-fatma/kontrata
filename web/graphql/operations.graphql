      sezon
      paraBirimi
      kurEsasi
      yetkiliMahkeme
      imzaTarihi
    }
    donem {
      baslangic
      bitis
      altDonemler {
        ad
        baslangic
        bitis
      }
    }
    odaKontenjanlari {
      odaTipi
      adet
