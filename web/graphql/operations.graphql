#graphql

query Sozlesmeler($limit: Int, $offset: Int) {
  sozlesmeler(limit: $limit, offset: $offset) {
    id
    dosyaAdi
    durum
    olusturmaTarihi
    guncellemeTarihi
    meta {
      otelAdi
      acenteAdi
    }
    donem {
      baslangic
      bitis
    }
    bulgular {
      onem
    }
  }
}

query Sozlesme($id: ID!) {
  sozlesme(id: $id) {
    id
    dosyaAdi
    durum
    olusturmaTarihi
    guncellemeTarihi
    meta {
      otelAdi
      acenteAdi
      sozlesmeTipi
      sezon
      paraBirimi
      kurEsasi
      yetkiliMahkeme
      imzaTarihi
    }
    donem {
      baslangic
      bitis
      altDonemler {
        ad
        baslangic
        bitis
      }
    }
    odaKontenjanlari {
      odaTipi
      adet
      aciklama
    }
    fiyatlar {
      odaTipi
      pansiyon
      tutar
      birim
      altDonemAd
    }
    release {
      gun
      kapsam
      kaynakIfade
    }
    stopSale {
      baslangic
      bitis
      kapsam
      bildirimYontemi
      kaynakIfade
    }
    cikarimMeta {
      alanYolu
      guven
      kaynakSayfa
      kaynakMadde
      elleDuzeltildi
    }
    duzeltmeler
    semaHatalari
    islemSuresi
    denetciSuresi
    bulgular {
      kod
      baslik
      aciklama
      onem
      kaynak
      alanYolu
    }
  }
}

query Oturumlarim {
  oturumlarim {
    id
    olusturmaTarihi
    sonKullanma
    ipAdresi
    kullaniciAjani
    mevcutMu
  }
}

query Cihazlarim {
  cihazlarim {
    id
    ad
    guvenilir
    ilkGorulme
    sonGorulme
    ipAdresi
    kullaniciAjani
  }
}

query Organizasyonum {
  organizasyonum {
    id
    ad
    vergiNo
    durum
    olusturmaTarihi
  }
}

query Uyeler {
  uyeler {
    id
    eposta
    rol
    hesapTipi
  }
}

mutation KayitOl(
  $eposta: String!
  $sifre: String!
  $hesapTipi: HesapTipi
  $organizasyonAdi: String
) {
  kayitOl(
    eposta: $eposta
    sifre: $sifre
    hesapTipi: $hesapTipi
    organizasyonAdi: $organizasyonAdi
  ) {
    basarili
    mesaj
  }
}

mutation EpostaDogrula($token: String!) {
  epostaDogrula(token: $token)
}

mutation DogrulamaTekrarGonder($eposta: String!) {
